<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardomancer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="view"></canvas>
<div id="vignette"></div>

<div id="loading" class="on">A baralhar as cartas...</div>

<section id="title">
  <h1>Cardomancer</h1>
  <p id="title-sub">Uma aventura que nunca se escolhe por inteiro.</p>
  <button id="start">Nova Partida</button>
</section>

<div id="prompt"><h2 id="prompt-title"></h2><p id="prompt-sub"></p></div>
<div id="toast"></div>
<div id="aviso"></div>
<div id="critico" role="status"></div>

<nav id="rail" aria-label="Estado da personagem">
  <div class="r-barras">
    <div class="r-barra vida" id="t-vida"><div class="tubo"><i id="b-vida"></i></div><img id="i-vida" alt=""><b id="r-vida">-</b></div>
    <div class="r-barra xp" id="t-xp"><div class="tubo"><i id="b-xp"></i></div><img id="i-xp" alt=""><b id="r-nivel">1</b></div>
  </div>
  <div class="r-ico ouro" title="Ouro"><img id="i-ouro" alt=""><b id="r-ouro">0</b></div>
  <div class="r-ico ca" title="Classe de Armadura: o que o inimigo tem de alcançar para lhe acertar"><img id="i-ca" alt=""><b id="r-ca">-</b></div>
  <div class="r-olhos" id="r-pistas" title="Pistas encontradas"></div>
  <div class="r-tools">
    <button id="abrir-painel">Ficha</button>
    <button id="peek-map">Mapa</button>
    <button id="ajuda">Ajuda</button>
    <button id="musica-btn">Música: sim</button>
    <button id="mute">Som: sim</button>
  </div>
</nav>

<div id="trilha" aria-label="Dias da missão"><img id="i-trilha" alt=""><div id="pips"></div></div>

<aside id="painel" aria-label="Ficha da personagem">
  <button id="fechar-painel" aria-label="Fechar a ficha">Fechar</button>
  <div id="painel-corpo"></div>
</aside>

<div id="lore" role="dialog" aria-modal="true">
  <article>
    <h2 id="lore-titulo"></h2>
    <p id="lore-texto"></p>
    <small>Clique em qualquer sítio para fechar.</small>
  </article>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/historia.js"></script>
<script src="js/regras.js"></script>
<script src="js/partida.js"></script>
<script src="js/textures.js"></script>
<script src="js/musica.js"></script>
<script src="js/scene.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
